<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieReviews - Reseña</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark navbar-expand-md">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-collection-play"></i> Movie<span class="text-primary">Reviews</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navContent">
        <ul class="navbar-nav ms-auto mt-2 mt-md-0">
          <li class="nav-item">
            <a class="nav-link" href="index.html"><i class="bi bi-house-door"></i> Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" id="btnFavoritos">
              <i class="bi bi-heart"></i> Favoritos
              <span class="badge bg-danger" id="favoritosCount">0</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Spinner -->
  <div id="loadingSpinner" class="text-center d-flex align-items-center justify-content-center" style="min-height: 300px;">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <!-- Error -->
  <div id="errorContainer" class="container text-center d-none mt-4">
    <div class="alert alert-danger">
      No se encontró información de esta película.
      <a href="index.html" class="btn btn-outline-danger btn-sm ms-2">Volver al inicio</a>
    </div>
  </div>

  <!-- Detalle -->
  <div class="container my-4 d-none" id="detalleContainer">
    <a href="index.html" class="btn btn-outline-secondary btn-sm mb-3"><i class="bi bi-arrow-left"></i> Volver</a>

    <div class="card shadow-sm">
      <div class="card-body">
        <div class="row g-4">
          <div class="col-md-4 text-center">
            <img id="poster" src="" alt="" class="detail-poster rounded shadow-sm">
          </div>
          <div class="col-md-8">
            <div class="d-flex justify-content-between align-items-start">
              <h2 id="titulo"></h2>
              <button class="btn btn-outline-danger" id="btnFavoritoDetalle">
                <i class="bi bi-heart" id="iconoFavoritoDetalle"></i> Favorito
              </button>
            </div>

            <div class="text-muted mb-3">
              <span id="anio"></span> &middot;
              <i class="bi bi-clock"></i> <span id="duracion"></span> min &middot;
              <span id="clasificacion" class="badge bg-secondary"></span>
            </div>

            <div class="mb-3">
              <span class="display-6 text-warning" id="rating"></span>
              <span class="text-warning" id="estrellas"></span>
              <span class="text-muted">(<span id="numVotos"></span> votos)</span>
            </div>

            <h6>Géneros</h6>
            <div class="mb-3" id="generos"></div>

            <div class="mb-3">
              <h6>Metascore</h6>
              <div class="progress metascore-bar">
                <div class="progress-bar" id="metascoreBar" role="progressbar"></div>
              </div>
              <span id="metascoreTexto" class="small text-muted"></span>
            </div>

            <p class="fst-italic" id="sinopsis"></p>

            <h6>Intereses</h6>
            <div class="mb-3" id="intereses"></div>

            <div class="row mb-3">
              <div class="col-6">
                <strong>Idiomas:</strong> <span id="idiomas"></span>
              </div>
              <div class="col-6">
                <strong>Países:</strong> <span id="paises"></span>
              </div>
              <div class="col-6 mt-2">
                <strong>Presupuesto:</strong> <span id="presupuesto"></span>
              </div>
              <div class="col-6 mt-2">
                <strong>Recaudación:</strong> <span id="recaudacion"></span>
              </div>
              <div class="col-12 mt-2">
                <strong>Productoras:</strong> <span id="productoras"></span>
              </div>
            </div>

            <a href="#" target="_blank" id="btnTrailer" class="btn btn-danger">
              <i class="bi bi-play-fill"></i> Ver tráiler
            </a>

            <div class="mt-3">
              <h6>Enlaces externos</h6>
              <div id="enlacesExternos"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Favoritos (mismo que index.html) -->
  <div class="modal fade" id="favoritosModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title text-danger">
            <i class="bi bi-heart-fill"></i> Mis Favoritos
            <span class="badge bg-danger" id="favoritosModalCount">0</span>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="favoritosModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button type="button" class="btn btn-danger" id="btnEliminarTodos"><i class="bi bi-trash"></i> Eliminar todos</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="favoritos.js"></script>
  <script src="detalle.js"></script>
</body>
</html>
