<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta de Perfil | Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Centrado vertical y horizontal -->
  <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="row justify-content-center w-100">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5">

        <!-- Tarjeta con borde redondeado y color primario -->
        <div class="card border border-primary border-2 rounded-4 shadow-sm">
          <div class="card-body text-center p-4">

            <!-- Avatar circular con sombra -->
            <img src="img/luis.jpeg" alt="Foto de perfil"
                 class="rounded-circle shadow mb-3" width="120" height="120">

            <!-- Nombre en negritas y color primario -->
            <h4 class="card-title fw-bold text-primary mb-1">Luis Felipe Rodriguez Rico</h4>
            <h6 class="text-secondary mb-3">Python Developer</h6>

            <!-- Descripción centrada y atenuada -->
            <p class="card-text text-center text-muted">
              Desarrollo y optimización de scripts y pipelines en Python para
              procesamiento de datos, automatización de flujos y refactorización
              de código legacy.
            </p>

            <!-- Habilidades como badges en lista horizontal -->
            <ul class="list-inline mb-4">
              <li class="list-inline-item"><span class="badge text-bg-primary">Python</span></li>
              <li class="list-inline-item"><span class="badge text-bg-primary">ETL</span></li>
              <li class="list-inline-item"><span class="badge text-bg-primary">APIs REST</span></li>
              <li class="list-inline-item"><span class="badge text-bg-primary">SQL</span></li>
              <li class="list-inline-item"><span class="badge text-bg-primary">Automatización</span></li>
            </ul>

            <!-- Botón con icono y estilo outline -->
            <a href="https://github.com/ELIMSS50" target="_blank"
               class="btn btn-outline-primary rounded-pill px-4">
              <i class="bi bi-github me-1"></i> Ver GitHub
            </a>

          </div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
